services:
  - type: web
    name: credit-risk-api
    runtime: python
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py backend.app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000

  - type: web
    name: credit-risk-ui
    runtime: python
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: API_URL
        value: https://credit-risk-assesment-1.onrender.com
      - key: BACKEND_URL
        value: https://credit-risk-assesment-1.onrender.com

  - type: static
    name: credit-risk-static-ui
    buildCommand: null
    staticPublishPath: ./static_site
    envVars:
      - key: API_URL
        value: https://credit-risk-assesment-1.onrender.com

